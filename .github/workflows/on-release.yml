# One release = one tool version. After it is published (or edited / deleted) this workflow:
#   1. rebuilds versions.json from all releases and commits it (the tools, VE Manager and the site read it),
#   2. e-mails the people who downloaded that tool (stable releases only; needs the secret MAILERLITE_TOKEN);
#      the first stable release of a tool also goes to the "lab-nowosci" group,
#   3. tells vizemotion.com to refresh (optional secret SITE_HOOK_URL).
name: on-release

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versions-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      SITE_HOOK_URL: ${{ secrets.SITE_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Build versions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_index.py
      - name: Commit versions.json
        run: |
          if ! git diff --quiet -- versions.json || [ -n "$(git ls-files --others -- versions.json)" ]; then
            git config user.name "vizemotion-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "versions.json: ${{ github.event.release.tag_name || 'manual rebuild' }}"
            git push
          fi
      - name: Refresh the site
        if: ${{ env.SITE_HOOK_URL != '' }}
        run: curl -fsS -X POST "$SITE_HOOK_URL" || echo "site hook failed (not blocking)"

  notify:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease }}
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E-mail the people who downloaded this tool
        env:
          MAILERLITE_TOKEN: ${{ secrets.MAILERLITE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # first stable release of a tool → also Lab news
        run: python3 tools/notify.py
